{% extends "base.html" %}

{% block title %}Login - Exam Cell Application{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-header">
        <i class="fas fa-graduation-cap" style="font-size: 48px; color: #667eea; margin-bottom: 20px;"></i>
        <h1>Exam Cell Application</h1>
        <p>National Institute of Technology Calicut</p>
    </div>
    
    <form method="POST">
        <div class="form-group">
            <label for="username">
                <i class="fas fa-user"></i> Username
            </label>
            <input type="text" id="username" name="username" class="form-control" required 
                   placeholder="Enter your username">
        </div>
        
        <div class="form-group">
            <label for="password">
                <i class="fas fa-lock"></i> Password
            </label>
            <input type="password" id="password" name="password" class="form-control" required 
                   placeholder="Enter your password">
        </div>
        
        <button type="submit" class="btn btn-primary">
            <i class="fas fa-sign-in-alt"></i> Login
        </button>
    </form>
    
    <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #e1e1e1; color: #666; font-size: 14px;">
        <p><strong>Default Login:</strong></p>
        <p>Username: admin</p>
        <p>Password: admin123</p>
    </div>
</div>
{% endblock %}
